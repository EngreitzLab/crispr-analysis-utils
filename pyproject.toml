[build-system]
# The package ships a compiled Rust core, so maturin builds it rather than
# hatchling. Cargo.toml at the root holds the crate; rust/ holds its sources.
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "crispr-analysis-utils"
version = "0.1.0"
description = "Python utilities and command-line tools for analysing CRISPR perturbation screens."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Engreitz Lab" },
]
keywords = [
    "crispr",
    "perturbation-screens",
    "guide-rna",
    "bioinformatics",
]
# No `License ::` classifier: PEP 639 forbids one next to a license expression.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "pysam>=0.22",
]

[project.scripts]
cau = "crispr_analysis_utils.cli:main"

[project.urls]
Homepage = "https://github.com/EngreitzLab/crispr-analysis-utils"
Documentation = "https://engreitzlab.github.io/crispr-analysis-utils/"
Repository = "https://github.com/EngreitzLab/crispr-analysis-utils"
Issues = "https://github.com/EngreitzLab/crispr-analysis-utils/issues"

# PEP 735 groups: development-only, never part of the published metadata.
# `uv sync` installs `dev` by default; pixi turns each group into a feature.
[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "pre-commit>=4",
]
# mkdocs-material 9.7.5+ itself caps mkdocs<2 (2.0 is a plugin-less rewrite).
docs = [
    "mkdocs-material>=9.7.5,<10",
    "mkdocstrings[python]>=1.0",
]

[tool.maturin]
# The Python package stays where it is; the extension lands inside it.
python-source = "src"
module-name = "crispr_analysis_utils._core"
# One abi3 wheel serves every supported Python, so the matrix is per platform.
features = ["pyo3/extension-module"]
# maturin would otherwise leave the tests out of the sdist.
include = [{ path = "tests/**/*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No -m here: it would deselect the gem marker by default.
addopts = "-ra --strict-markers"
markers = [
    "gem: needs the GEM3 binaries on the PATH (the pixi environments have them)",
]

[tool.uv]
# The single uv pin: setup-uv in CI reads it, and the lockfile format is stable within a minor.
required-version = ">=0.12,<0.13"

# pixi reads this same file. Conda-only tools come from conda-forge and bioconda;
# Python packages still resolve from PyPI. pixi locks to pixi.lock, uv to uv.lock.
[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.81"

[tool.pixi.dependencies]
python = "3.13.*"
# The editable install builds the Rust core, so every environment needs them.
rust = ">=1.80"
maturin = ">=1.9,<2"

# bioconda builds gem3-mapper for linux-64 and osx-64, not osx-arm64, so an environment
# with this feature has only those two platforms and runs under Rosetta on Apple silicon.
# It is quarantined in the `gem` environment on purpose: default, dev and docs stay
# native everywhere, and this goes away with gem.py.
[tool.pixi.feature.gem]
platforms = ["linux-64", "osx-64"]

[tool.pixi.feature.gem.dependencies]
gem3-mapper = ">=3.6.1"

# pixi does not install the project by itself.
[tool.pixi.pypi-dependencies]
crispr-analysis-utils = { path = ".", editable = true }

# The `dev` and `docs` groups become features of the same name; `gem` is defined above.
# Only the `gem` environment carries GEM3, and only it is limited to linux-64 and
# osx-64; everything else is native on all three platforms.
[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
gem = { features = ["dev", "gem"] }

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest", description = "Run the test suite" }
# no-commit-to-branch always runs, and would fail whenever HEAD is main.
lint = { cmd = "pre-commit run --all-files", env = { SKIP = "no-commit-to-branch" }, description = "Run every pre-commit hook on every tracked file" }
install-hooks = { cmd = "pre-commit install", description = "Install the commit and push hooks in this clone" }

[tool.pixi.feature.docs.tasks]
docs = { cmd = "mkdocs serve", description = "Serve the docs locally with live reload" }
docs-build = { cmd = "mkdocs build --strict", description = "Build the docs as CI does" }

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
# Explicit on purpose: ruff 0.16 grew its default rule set from 59 to 413 rules,
# and `select` replaces that set. W brings W191 (tab indentation).
select = ["E", "W", "F", "I", "UP", "B"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
