# Separate from ci.yml, so a docs failure never hides the other checks.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job widens it for itself.
permissions:
  contents: read

# Builds queue per branch (a newer push to a pull request cancels the older
# build); only the deploy job shares the repository-wide `pages` group.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs on every pull request: --strict turns a broken link or reference into a failure.
  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      # mkdocstrings reads src/ statically, so only the docs group is installed.
      - run: uv run --locked --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only from main: pull requests build the site but never publish it.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs-build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
