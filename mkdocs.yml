site_name: CRISPR Analysis Utils
site_description: Reusable utilities for CRISPR screen analysis.
site_url: https://engreitzlab.github.io/crispr-analysis-utils/
repo_url: https://github.com/EngreitzLab/crispr-analysis-utils

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: false
            show_symbol_type_toc: true
            show_signature_annotations: true
            separate_signature: true
            docstring_section_style: list

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  # Pages include README.md sections, and the output tables and notes of the
  # skills' references/ (cau-guide-alignment, cau-guide-qc), by marker instead
  # of copying them. check_paths turns a missing include into a build failure.
  - pymdownx.snippets:
      base_path: [docs, .]
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Guide alignment: guide-alignment.md
      - "Tutorial: guide alignment on a cluster": tutorial-guide-alignment.md
      - Guide QC: guide-qc.md
      - GEM mapper: gem-mapper.md
      - "Tutorial: guide alignment QC": tutorial-guide-alignment-qc.md
  - Agents and skills: agents-and-skills.md
  - API reference:
      - Overview: reference/index.md
      - Guide alignment:
          - run: reference/guide-alignment-run.md
          - Guide library: reference/guide-alignment-library.md
          - GEM: reference/guide-alignment-gem.md
          - Sites: reference/guide-alignment-sites.md
          - Orientation: reference/guide-alignment-orientation.md
          - Classes and tables: reference/guide-alignment-summary.md
          - IUPAC codes: reference/guide-alignment-iupac.md
      - Preprocessing:
          - guides_to_fastq: reference/guides-to-fastq.md
          - filter_guide_alignments: reference/filter-guide-alignments.md
      - Mapping:
          - build_gem_index: reference/build-gem-index.md
          - map_guides_with_gem: reference/map-guides-with-gem.md
      - Normalization:
          - counts_per_million: reference/counts-per-million.md
      - Utilities:
          - run_shell_cmd: reference/run-shell-cmd.md
  - Contributing: contributing.md
